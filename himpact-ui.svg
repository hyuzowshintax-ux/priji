    <rect x="24" y="24" width="40" height="40" rx="10" fill="#312e81" />
    <text x="44" y="49" fill="#818cf8" font-size="18" text-anchor="middle">❖</text>
    <text x="24" y="94" fill="#ffffff" font-family="Plus Jakarta Sans, Inter, sans-serif" font-weight="700" font-size="16">Design System Terpadu</text>
    <text x="24" y="120" fill="#64748b" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="12">Pustaka komponen UI, token desain, dan template siap pakai standar industri.</text>

    <!-- Feature 2 -->
    <rect x="370" y="0" width="340" height="180" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
