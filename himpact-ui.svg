      <text x="34" y="66" fill="#ffffff" font-weight="700" font-size="10" text-anchor="middle">SH</text>

      <circle cx="62" cy="62" r="16" fill="#06b6d4" />
      <text x="62" y="66" fill="#ffffff" font-weight="700" font-size="10" text-anchor="middle">AK</text>

