  <circle cx="1200" cy="300" r="350" fill="url(#bgGlow2)" filter="url(#blurFilter)" />

  <!-- ================= NAVBAR ================= -->
  <rect x="120" y="24" width="1200" height="72" rx="20" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1" />
  
  <!-- Logo -->
  <rect x="144" y="40" width="40" height="40" rx="10" fill="url(#btnGrad)" />
  <text x="164" y="66" fill="#ffffff" font-family="Plus Jakarta Sans, Inter, sans-serif" font-weight="800" font-size="20" text-anchor="middle">H</text>
  <text x="196" y="58" fill="#ffffff" font-family="Plus Jakarta Sans, Inter, sans-serif" font-weight="700" font-size="16">HIMPACT</text>
  <text x="196" y="73" fill="#64748b" font-family="Plus Jakarta Sans, Inter, sans-serif" font-weight="600" font-size="10" letter-spacing="1.5">INOVASI &amp; DESAIN</text>

